
name: Module 13 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastapi_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_test_db
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      JWT_REFRESH_SECRET_KEY: ${{ secrets.CI_JWT_REFRESH_SECRET_KEY }}
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m pytest tests/unit/ --no-cov

      - name: Run integration tests
        run: python -m pytest tests/integration/ --no-cov

      - name: Initialize database and start FastAPI
        run: |
          python -m app.database_init
          nohup uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 > /tmp/fastapi.log 2>&1 &

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/fastapi.log
          exit 1

      - name: Run Playwright authentication tests
        run: |
          python -m pytest tests/e2e/test_auth_playwright.py \
            --no-cov --preserve-db

      - name: Run remaining E2E tests
        run: |
          python -m pytest tests/e2e/test_fastapi_calculator.py \
            --no-cov --preserve-db

  security:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t module13:test .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: module13:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  deploy:
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            navidislam/module13_is601:latest
            navidislam/module13_is601:${{ github.sha }}
